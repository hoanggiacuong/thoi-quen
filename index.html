<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Lịch xinh</title>
<meta name="theme-color" content="#fdf6f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lịch xinh">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
  /* ====== Đổi màu / cỡ ở đây (pastel) ====== */
  :root {
    --bg: #fdf6f0;        /* nền kem */
    --card: #ffffff;      /* nền bảng chọn */
    --empty: #ece3dd;     /* ô chưa làm */
    --future: #f6efea;    /* ngày chưa tới */
    --text: #6b5b73;      /* chữ chính (tím xám) */
    --label: #b89a9a;     /* chữ "Tuần 1" */
    --soft: rgba(107, 91, 115, .07);
    --gap: 4px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body { margin: 0; }
  body {
    font-family: "Baloo 2", system-ui, -apple-system, sans-serif;
    color: var(--text);
    min-height: 100vh;
    padding: calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 24px);
    -webkit-user-select: none; user-select: none;
  }
  .wrap { max-width: 460px; margin: 0 auto; position: relative; }
  header { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 18px; }
  h1 { font-size: 34px; font-weight: 800; letter-spacing: 3px; margin: 0; text-align: center; flex: 1; }
  .nav {
    width: 40px; height: 40px; border: 0; border-radius: 12px; background: var(--soft);
    color: var(--text); font-size: 22px; font-family: inherit; cursor: pointer;
  }
  .nav:disabled { opacity: .3; }
  .row { display: grid; grid-template-columns: 58px repeat(7, 1fr); gap: var(--gap); margin-bottom: var(--gap); align-items: center; }
  .row .lbl { font-size: 12px; font-weight: 800; color: var(--label); text-align: right; padding-right: 8px; white-space: nowrap; }
  .cell {
    aspect-ratio: 1; border-radius: 6px; background: var(--empty); position: relative; overflow: hidden;
    border: 0; padding: 0; cursor: pointer; transition: background .25s, transform .15s;
  }
  .cell:active { transform: scale(.9); }
  .cell.on { box-shadow: inset 0 -2px 0 rgba(0,0,0,.05); }
  .cell.future { background: var(--future); cursor: default; }
  .cell.today { outline: 2px solid var(--text); outline-offset: 1px; }
  .cell.blank { visibility: hidden; }
  .cell span { position: absolute; top: 2px; left: 4px; font-size: 10px; font-weight: 700; color: rgba(107,91,115,.45); }
  .cell.on span { color: rgba(107,91,115,.8); }
  .cell.future span { color: rgba(107,91,115,.25); }
  .cell.pop { animation: pop .6s ease; }
  @keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
  .legend { display: flex; justify-content: center; gap: 8px 16px; flex-wrap: wrap; margin: 0 0 14px; }
  .legend div { display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 800; }
  .legend i { width: 16px; height: 16px; border-radius: 5px; background: var(--c); display: inline-block; }
  .legend small { font-size: 12px; opacity: .65; font-weight: 700; }
  .legend .add { width: 28px; height: 28px; border: 0; border-radius: 50%; background: #e7dcf5; color: var(--text);
    display: inline-flex; align-items: center; justify-content: center; padding: 0; cursor: pointer;
    box-shadow: 0 2px 6px rgba(107,91,115,.15); transition: transform .15s; }
  .legend .add:active { transform: scale(.88); }
  .mrow { display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin-bottom: 6px; border-radius: 12px; background: var(--soft); font-weight: 800; font-size: 17px; }
  .mrow i { width: 20px; height: 20px; border-radius: 6px; background: var(--c); }
  .mrow button { margin-left: auto; border: 0; border-radius: 8px; padding: 4px 12px; background: #ffd6d6; color: #a25b5b; font: 700 14px "Baloo 2", system-ui, sans-serif; cursor: pointer; }
  .cell .flower { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-style: normal; font-size: 18px; line-height: 1; filter: drop-shadow(0 1px 1px rgba(107,91,115,.25)); pointer-events: none; }
  .cell .flower img { width: 62%; height: 62%; object-fit: contain; }
  .cell.future .flower { opacity: .55; }
  .sheet button.cheatbtn .fl img { width: 22px; height: 22px; display: block; }
  .iconpick { display: flex; gap: 8px; margin: -2px 0 8px; }
  .iconpick button { flex: 1; height: 52px; border: 2px solid transparent; border-radius: 12px; background: var(--soft); cursor: pointer; padding: 6px; }
  .iconpick button.sel { border-color: #ff9fc4; background: #ffe4ef; }
  .iconpick img { height: 100%; width: auto; }
  .emo { font-style: normal; line-height: 1; }
  .iconpick .emo { font-size: 30px; }
  .sheet button.cheatbtn .fl .emo { font-size: 18px; }
  .cell.future { cursor: pointer; }
  .sheet button.cheatbtn .fl { width: 22px; text-align: center; font-size: 18px; filter: grayscale(1) opacity(.45); }
  .sheet button.cheatbtn.on { background: #ffe4ef; }
  .sheet button.cheatbtn.on .fl { filter: none; }
  .cheatbox { margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(107,91,115,.12); }
  .cheatlbl { font-weight: 800; font-size: 16px; margin-bottom: 8px; }
  #cheatDow { display: flex; flex-wrap: wrap; gap: 6px; }
  #cheatDow .chip { border: 0; border-radius: 10px; padding: 6px 10px; background: var(--soft); color: var(--text);
    font: 800 14px "Baloo 2", system-ui, sans-serif; cursor: pointer; }
  #cheatDow .chip.sel { background: #ffc6e5; }
  .row.head { margin-bottom: 2px; }
  .row .wd { text-align: center; font-size: 12px; font-weight: 800; color: var(--label); }
  .row .wd.we { color: #e08f9a; }
  .row .wd.now { color: var(--text); }
  .mrow button.armed { background: #ff8f8f; color: #fff; }
  .newbox { margin: 14px 0 6px; padding-top: 12px; border-top: 1px solid rgba(107,91,115,.12); }
  .newbox input { width: 100%; padding: 10px 12px; border: 1.5px solid var(--empty); border-radius: 12px; font: 700 16px "Baloo 2", system-ui, sans-serif; background: var(--bg); color: var(--text); -webkit-user-select: text; user-select: text; outline: none; }
  #colors { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  #colors .sw { width: 30px; height: 30px; border-radius: 8px; border: 2px solid transparent; cursor: pointer; padding: 0; }
  #colors .sw.sel { border-color: var(--text); }
  .sheet button.addh { justify-content: center; background: #e7dcf5; }
  .sheet-bg { position: fixed; inset: 0; background: rgba(107,91,115,.25); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
  .sheet-bg.open { display: flex; }
  .sheet { background: var(--card); width: 100%; max-width: 460px; border-radius: 20px 20px 0 0; padding: 16px 16px calc(env(safe-area-inset-bottom) + 18px); box-shadow: 0 -6px 24px rgba(107,91,115,.12); }
  .sheet h3 { margin: 0 0 12px; text-align: center; font-size: 20px; }
  .sheet button.h { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 14px; margin-bottom: 8px; border: 0; border-radius: 12px;
    background: var(--soft); color: var(--text); font: 800 17px "Baloo 2", system-ui, sans-serif; cursor: pointer; }
  .sheet button.h i { width: 22px; height: 22px; border-radius: 6px; background: var(--empty); }
  .sheet button.h.on i { background: var(--c); }
  .sheet button.h b { margin-left: auto; font-size: 14px; opacity: .7; }
  .sheet button.close { width: 100%; padding: 10px; border: 0; border-radius: 10px; background: transparent; color: var(--text); font: 700 15px "Baloo 2", system-ui, sans-serif; opacity: .7; }
  .hint { text-align: center; font-size: 12px; opacity: .55; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="nav" id="prev" aria-label="Tháng trước">‹</button>
    <h1 id="title">Tháng</h1>
    <button class="nav" id="next" aria-label="Tháng sau">›</button>
  </header>
  <div class="legend" id="legend"></div>
  <div id="cal"></div>
</div>
<div class="sheet-bg" id="sheetBg">
  <div class="sheet">
    <h3 id="sheetTitle">Ngày</h3>
    <div id="sheetList"></div>
    <button class="close" id="sheetClose">Xong</button>
  </div>
</div>
<div class="sheet-bg" id="manageBg">
  <div class="sheet">
    <h3>Cài đặt</h3>
    <div id="manageList"></div>
    <div class="cheatbox">
      <div class="cheatlbl">Cheat day mỗi tuần</div>
      <div id="cheatDow"></div>
      <div class="cheatlbl" style="margin-top:12px">Hình đánh dấu</div>
      <div id="cheatIcon"></div>
    </div>
    <div class="newbox">
      <input id="newName" maxlength="20" placeholder="Tên chủ đề mới (vd: Tập thể dục)">
      <div id="colors"></div>
      <button class="h addh" id="addHabit">+ Thêm chủ đề</button>
    </div>
    <button class="close" id="manageClose">Xong</button>
  </div>
</div>

<script>
// ====== Danh sách thói quen: thêm/bớt/đổi màu ở đây ======
const DEFAULT_HABITS = [
  { id: "giamcan", name: "Giảm cân", color: "#ffadad" },
  { id: "uongnuoc", name: "Uống nước", color: "#a0c4ff" },
  { id: "tapluyen", name: "Tập luyện", color: "#b5e8c3" },
];
// Bảng màu pastel để chọn khi thêm chủ đề
const COLORS = ["#ffadad", "#a0c4ff", "#b5e8c3", "#fdf1a6", "#ffd6a5", "#cdb4ff", "#ffc6e5", "#a8eee8", "#e6ccb2", "#d0d4dc"];
// Đổi màu đậm của bản cũ sang pastel tương ứng
const OLD2PASTEL = { "#f20d0d": "#ffadad", "#4a90ff": "#a0c4ff", "#2ecc40": "#b5e8c3", "#ffcc00": "#fdf1a6", "#ff8a00": "#ffd6a5",
  "#b84dff": "#cdb4ff", "#ff4fa3": "#ffc6e5", "#00d1c1": "#a8eee8", "#8b5a2b": "#e6ccb2", "#ffffff": "#d0d4dc" };

const KEY = "habit-calendar-v1";
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
const save = (d) => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch {} };
let data = load();               // { days: {habitId: {"2026-11-13": true}}, auto: {"2026-11-13": true} }
data.days ||= {}; data.auto ||= {};
data.habits ||= DEFAULT_HABITS;   // danh sách chủ đề lưu trong máy, thêm/xoá ngay trong app
let HABITS = data.habits;
HABITS.forEach(h => { if (OLD2PASTEL[h.color]) h.color = OLD2PASTEL[h.color]; });
save(data);
HABITS.forEach(h => data.days[h.id] ||= {});
// Cheat day: mặc định Thứ 7 (getDay: 0=CN, 6=T7; -1 = không có). data.cheat[ngày] = true/false để đổi riêng từng ngày
if (data.cheatDow === undefined) data.cheatDow = 6;
data.cheat ||= {};
// Hình đánh dấu cheat day: mặc định chọn trong Cài đặt, mỗi ngày có thể chọn riêng (data.cheatIcons[ngày])
// heo / tim / dâu = ảnh (heo thay cho bông hoa cũ)
const ICONS = { heo: `<img src="cheat-heo.png" alt="">`, tim: `<img src="cheat-tim.png" alt="">`, dau: `<img src="cheat-dau.png" alt="">` };
data.cheatIcons ||= {};
// Dữ liệu cũ đang chọn "hoa" -> đổi sang "heo"
if (!data.cheatIcon || data.cheatIcon === "hoa") data.cheatIcon = "heo";
for (const k in data.cheatIcons) if (data.cheatIcons[k] === "hoa") data.cheatIcons[k] = "heo";
const iconOf = k => ICONS[data.cheatIcons[k]] || ICONS[data.cheatIcon] || ICONS.heo;
const iconPicker = (cur, onPick) => {
  const w = document.createElement("div");
  w.className = "iconpick";
  Object.entries(ICONS).forEach(([id, html]) => {
    const b = document.createElement("button");
    b.className = id === cur ? "sel" : "";
    b.innerHTML = html;
    b.onclick = () => onPick(id);
    w.appendChild(b);
  });
  return w;
};
const isCheat = (k, dow) => (k in data.cheat) ? data.cheat[k] : dow === data.cheatDow;
const DOW_NAMES = ["CN", "T2", "T3", "T4", "T5", "T6", "T7"];

const pad = n => String(n).padStart(2, "0");
const ymd = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
const todayKey = () => { const t = new Date(); return ymd(t.getFullYear(), t.getMonth(), t.getDate()); };

const now = new Date();
let viewY = now.getFullYear(), viewM = now.getMonth();
let justLit = null;

// Vào app hôm nay -> tự sáng (mỗi ngày chỉ tự bật 1 lần, nếu chạm tắt thì không bật lại)
function autoMark() {
  const k = todayKey();
  if (data.auto[k]) return false;
  if (isCheat(k, new Date().getDay())) return false;   // cheat day: không tự tô màu
  data.auto[k] = true;
  HABITS.forEach(h => data.days[h.id][k] = true);
  save(data);
  justLit = k;
  return true;
}

function render() {
  const t = new Date();
  const tk = todayKey();
  const daysInMonth = new Date(viewY, viewM + 1, 0).getDate();
  // Lịch thật: tuần bắt đầu Thứ 2. offset = số ô trống trước ngày 1
  const offset = (new Date(viewY, viewM, 1).getDay() + 6) % 7;
  const weeks = Math.ceil((offset + daysInMonth) / 7);
  document.getElementById("title").textContent = `Tháng ${viewM + 1}` + (viewY !== t.getFullYear() ? ` · ${viewY}` : "");
  document.getElementById("next").disabled = viewY > t.getFullYear() || (viewY === t.getFullYear() && viewM >= t.getMonth());

  // Ô nhiều màu: mỗi việc 1 dải cố định (trên→dưới), việc chưa làm thì dải đó xám
  const fill = k => {
    const n = HABITS.length;
    if (!HABITS.some(h => data.days[h.id][k])) return "";
    return "linear-gradient(to bottom," + HABITS.map((h, i) => {
      const c = data.days[h.id][k] ? h.color : "var(--empty)";
      return `${c} ${(i / n * 100).toFixed(2)}%, ${c} ${((i + 1) / n * 100).toFixed(2)}%`;
    }).join(",") + ")";
  };

  const counts = HABITS.map(() => 0);
  let past = 0;
  const root = document.getElementById("cal");
  root.innerHTML = "";
  const head = document.createElement("div");
  head.className = "row head";
  const todayCol = (viewY === t.getFullYear() && viewM === t.getMonth()) ? (t.getDay() + 6) % 7 : -1;
  head.innerHTML = `<div></div>` + ["T2", "T3", "T4", "T5", "T6", "T7", "CN"]
    .map((s, i) => `<div class="wd${i >= 5 ? " we" : ""}${i === todayCol ? " now" : ""}">${s}</div>`).join("");
  root.appendChild(head);
  for (let w = 0; w < weeks; w++) {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<div class="lbl">Tuần ${w + 1}</div>`;
    for (let i = 0; i < 7; i++) {
      const d = w * 7 + i + 1 - offset;
      const b = document.createElement("button");
      b.className = "cell";
      if (d < 1 || d > daysInMonth) { b.classList.add("blank"); row.appendChild(b); continue; }
      const k = ymd(viewY, viewM, d);
      b.innerHTML = `<span>${d}</span>`;
      const dow = new Date(viewY, viewM, d).getDay();
      const cheat = isCheat(k, dow);
      if (cheat) { b.innerHTML += `<em class="flower">${iconOf(k)}</em>`; b.classList.add("cheat"); }
      if (k > tk) { b.classList.add("future"); b.onclick = () => openSheet(k, d, true); }
      else if (cheat) { b.onclick = () => openSheet(k, d); }   // cheat day: chỉ hoa, không tô màu, không tính vào số ngày
      else {
        past++;
        HABITS.forEach((h, j) => { if (data.days[h.id][k]) counts[j]++; });
        const bg = fill(k);
        if (bg) { b.classList.add("on"); b.style.background = bg; }
        if (k === justLit) b.classList.add("pop");
        b.onclick = () => openSheet(k, d);
      }
      if (k === tk) b.classList.add("today");
      row.appendChild(b);
    }
    root.appendChild(row);
  }

  document.getElementById("legend").innerHTML = HABITS.map((h, j) =>
    `<div style="--c:${h.color}"><i></i>${esc(h.name)} <small>${counts[j]}/${past}</small></div>`).join("")
    + `<button class="add" id="addBtn" aria-label="Thêm / sửa chủ đề"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>`;
  document.getElementById("addBtn").onclick = openManage;
}

const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ====== Thêm / xoá chủ đề ======
const manageBg = document.getElementById("manageBg");
let pickColor = null;
function openManage() {
  const used = HABITS.map(h => h.color);
  pickColor = COLORS.find(c => !used.includes(c)) || COLORS[0];
  drawManage();
  document.getElementById("newName").value = "";
  manageBg.classList.add("open");
}
function drawManage() {
  const list = document.getElementById("manageList");
  list.innerHTML = "";
  HABITS.forEach(h => {
    const r = document.createElement("div");
    r.className = "mrow";
    r.style.setProperty("--c", h.color);
    r.innerHTML = `<i></i><span>${esc(h.name)}</span>`;
    const del = document.createElement("button");
    del.textContent = "Xoá";
    // Bấm 1 lần -> "Chắc chưa?", bấm lần 2 trong 3 giây mới xoá (không dùng confirm() vì app trên màn hình chính có thể chặn hộp thoại)
    del.onclick = () => {
      if (HABITS.length <= 1) { del.textContent = "Cần ≥ 1 chủ đề"; setTimeout(() => del.textContent = "Xoá", 1500); return; }
      if (!del.dataset.armed) {
        del.dataset.armed = "1"; del.textContent = "Chắc chưa?"; del.classList.add("armed");
        setTimeout(() => { delete del.dataset.armed; del.textContent = "Xoá"; del.classList.remove("armed"); }, 3000);
        return;
      }
      HABITS.splice(HABITS.indexOf(h), 1);
      delete data.days[h.id];
      save(data); drawManage(); render();
    };
    r.appendChild(del);
    list.appendChild(r);
  });
  // Chọn thứ mặc định làm cheat day
  document.getElementById("cheatDow").innerHTML = [1, 2, 3, 4, 5, 6, 0, -1].map(v =>
    `<button class="chip${v === data.cheatDow ? " sel" : ""}" data-v="${v}">${v === -1 ? "Không" : DOW_NAMES[v]}</button>`).join("");
  document.querySelectorAll("#cheatDow .chip").forEach(b => b.onclick = () => {
    data.cheatDow = +b.dataset.v; save(data); drawManage(); render();
  });
  const ic = document.getElementById("cheatIcon");
  ic.innerHTML = "";
  ic.appendChild(iconPicker(data.cheatIcon, id => { data.cheatIcon = id; save(data); drawManage(); render(); }));
  document.getElementById("colors").innerHTML = COLORS.map(c =>
    `<button class="sw${c === pickColor ? " sel" : ""}" style="background:${c}" data-c="${c}" aria-label="màu"></button>`).join("");
  document.querySelectorAll("#colors .sw").forEach(b => b.onclick = () => { pickColor = b.dataset.c; drawManage(); });
}
document.getElementById("addHabit").onclick = () => {
  const inp = document.getElementById("newName");
  const name = inp.value.trim();
  if (!name) { inp.focus(); return; }
  const id = "h" + Date.now();
  HABITS.push({ id, name, color: pickColor });
  data.days[id] = { [todayKey()]: true };   // chủ đề mới: hôm nay sáng luôn
  justLit = todayKey();
  save(data);
  openManage(); render();
};
document.getElementById("manageClose").onclick = () => manageBg.classList.remove("open");
manageBg.onclick = e => { if (e.target === manageBg) manageBg.classList.remove("open"); };

// Bảng chọn việc khi chạm vào 1 ngày
const sheetBg = document.getElementById("sheetBg");
function openSheet(k, d, future = false) {
  const dow = new Date(viewY, viewM, d).getDay();
  document.getElementById("sheetTitle").textContent = `${dow === 0 ? "Chủ nhật" : "Thứ " + (dow + 1)}, ${d}/${viewM + 1}`;
  const list = document.getElementById("sheetList");
  const draw = () => {
    list.innerHTML = "";
    // Nút cheat day cho riêng ngày này
    const cb = document.createElement("button");
    const cheat = isCheat(k, dow);
    cb.className = "h cheatbtn" + (cheat ? " on" : "");
    cb.innerHTML = `<span class="fl">${iconOf(k)}</span>Cheat day<b>${cheat ? "Có" : "Không"}</b>`;
    cb.onclick = () => {
      const want = !cheat;
      // Trùng với mặc định thì bỏ ghi đè, khác thì lưu riêng
      if (want === (dow === data.cheatDow)) delete data.cheat[k]; else data.cheat[k] = want;
      save(data); justLit = null; draw(); render();
    };
    // Cheat day đang bật: cho chọn hình riêng cho ngày này
    const pick = cheat ? iconPicker(data.cheatIcons[k] || data.cheatIcon, id => {
      if (id === data.cheatIcon) delete data.cheatIcons[k]; else data.cheatIcons[k] = id;
      save(data); draw(); render();
    }) : null;
    if (future || cheat) { list.appendChild(cb); if (pick) list.appendChild(pick); return; }   // ngày tương lai / cheat day: chỉ có nút cheat
    HABITS.forEach(h => {
      const b = document.createElement("button");
      const on = !!data.days[h.id][k];
      b.className = "h" + (on ? " on" : "");
      b.style.setProperty("--c", h.color);
      b.innerHTML = `<i></i>${h.name}<b>${on ? "Đã làm" : "Chưa"}</b>`;
      b.onclick = () => {
        if (on) delete data.days[h.id][k]; else data.days[h.id][k] = true;
        save(data); justLit = null; draw(); render();
      };
      list.appendChild(b);
    });
    list.appendChild(cb);
  };
  draw();
  sheetBg.classList.add("open");
}
document.getElementById("sheetClose").onclick = () => sheetBg.classList.remove("open");
sheetBg.onclick = e => { if (e.target === sheetBg) sheetBg.classList.remove("open"); };

document.getElementById("prev").onclick = () => { if (--viewM < 0) { viewM = 11; viewY--; } justLit = null; render(); };
document.getElementById("next").onclick = () => { if (++viewM > 11) { viewM = 0; viewY++; } justLit = null; render(); };

// Mở lại app từ nền (iOS giữ app trong bộ nhớ qua đêm) -> kiểm tra ngày mới
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  const t = new Date(); viewY = t.getFullYear(); viewM = t.getMonth();
  autoMark(); render();
});

autoMark();
render();

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js");
}
</script>
